<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Top band -->
  <rect x="170" y="60" width="60" height="85" rx="6" fill="url(#band)"/>
  <!-- Bottom band -->
  <rect x="170" y="255" width="60" height="85" rx="6" fill="url(#band)"/>
  <!-- Watch case (larger 46mm) -->
  <circle cx="200" cy="200" r="84" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
  <circle cx="200" cy="200" r="75" fill="#0a0a0a"/>
  <!-- Crown button -->
  <rect x="281" y="192" width="12" height="16" rx="3" fill="#333"/>
  <!-- Watch face -->
  <circle cx="200" cy="200" r="70" fill="none" stroke="#222" stroke-width="0.5"/>
  <!-- Hour markers -->
  <line x1="200" y1="135" x2="200" y2="143" stroke="#555" stroke-width="2"/>
  <line x1="200" y1="257" x2="200" y2="265" stroke="#555" stroke-width="2"/>
  <line x1="135" y1="200" x2="143" y2="200" stroke="#555" stroke-width="2"/>
  <line x1="257" y1="200" x2="265" y2="200" stroke="#555" stroke-width="2"/>
  <!-- Hands -->
  <line x1="200" y1="200" x2="200" y2="153" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="240" y2="182" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="3" fill="#ef4444"/>
  <!-- Label -->
  <text x="200" y="340" text-anchor="middle" fill="#666" font-family="system-ui,sans-serif" font-size="14" font-weight="500">SMART WATCH</text>
  <text x="200" y="358" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="12">46mm Black</text>
</svg>
