# Scaling overlay — use with: docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
#
# Enables multiple replicas of FastAPI and Next.js behind Nginx load balancing.
# Update docker/nginx.conf upstream blocks to match replica count if needed.

services:
  fastapi:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  nextjs:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
